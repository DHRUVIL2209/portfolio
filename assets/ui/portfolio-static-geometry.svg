<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#282828" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Original subtle portfolio grid -->
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Original-style geometry, with the square elements intentionally removed -->
  <g fill="none" stroke="#282828" stroke-opacity=".18" stroke-width="1">
    <circle cx="1530" cy="292" r="22"/>
    <circle cx="1450" cy="572" r="8"/>
    <circle cx="1950" cy="1140" r="500" stroke-opacity=".065"/>
  </g>

  <!-- Plus marks from the original hero geometry -->
  <g fill="#282828" fill-opacity=".18" font-family="IBM Plex Mono, monospace"
     font-size="22" text-anchor="middle">
    <text x="1670" y="690">+</text>
    <text x="1380" y="730">+</text>
  </g>
</svg>